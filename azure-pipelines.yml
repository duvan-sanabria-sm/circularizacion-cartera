trigger:
  branches:
    include:
      - main

pool:
  name: 'Default'

variables:
  projectFolder: '$(Build.SourcesDirectory)'
  outputFolder: '$(Build.ArtifactStagingDirectory)\Packages'
  orchestratorConnection: 'UiPath-Orchestrator-SoportePruebas'
  orchestratorFolder: 'Default'

steps:
- task: UiPathPack@6
  displayName: 'Pack UiPath project'
  inputs:
    versionType: 'AutoVersion'
    projectJsonPath: '$(projectFolder)\project.json'
    outputPath: '$(outputFolder)'
    outputType: 'Process'
    orchestratorConnection: '$(orchestratorConnection)'
    traceLevel: 'Information'

- task: UiPathDeploy@6
  displayName: 'Deploy package to Orchestrator'
  inputs:
    orchestratorConnection: '$(orchestratorConnection)'
    packagesPath: '$(outputFolder)'
    folderName: '$(orchestratorFolder)'
    traceLevel: 'Information'

- task: PowerShell@2
  displayName: 'Create folders and import assets to new Orchestrator account'
  inputs:
    targetType: 'filePath'
    filePath: '$(Build.SourcesDirectory)/orchestrator/scripts/import-assets.ps1'
    pwsh: false
  env:
    UIPATH_ORG: $(UIPATH_ORG)
    UIPATH_TENANT: $(UIPATH_TENANT)
    UIPATH_CLIENT_ID: $(UIPATH_CLIENT_ID)
    UIPATH_CLIENT_SECRET: $(UIPATH_CLIENT_SECRET)
    UIPATH_FOLDER_ID: $(UIPATH_FOLDER_ID)
    UIPATH_FOLDER_PATH: $(UIPATH_FOLDER_PATH)


